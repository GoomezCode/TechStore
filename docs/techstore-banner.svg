<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">TechStore — auditoria e correção de ICMS</title>
  <desc id="desc">Banner do mini hackathon TechStore com os indicadores da carga inicial: dez produtos, oito divergências e impacto de R$ 753,38.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1040" cy="30" r="210" fill="#1d4ed8" opacity="0.16"/>
  <circle cx="1120" cy="330" r="150" fill="#22c55e" opacity="0.10"/>
  <rect x="0" y="0" width="1200" height="8" rx="4" fill="url(#accent)"/>
  <text x="64" y="70" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">MINI HACKATHON</text>
  <text x="64" y="132" fill="#f8fafc" font-family="Arial, sans-serif" font-size="54" font-weight="700">TechStore</text>
  <text x="64" y="172" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">Fechamento fiscal · auditoria e correção de ICMS</text>
  <text x="64" y="207" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Python + Tkinter + MySQL</text>
  <g transform="translate(64 252)">
    <rect width="210" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="18" y="30" fill="#60a5fa" font-family="Arial, sans-serif" font-size="26" font-weight="700">10</text>
    <text x="18" y="53" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PRODUTOS</text>
    <rect x="228" width="210" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="246" y="30" fill="#fbbf24" font-family="Arial, sans-serif" font-size="26" font-weight="700">8</text>
    <text x="246" y="53" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DIVERGENTES</text>
    <rect x="456" width="240" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="474" y="30" fill="#f87171" font-family="Arial, sans-serif" font-size="24" font-weight="700">R$ 753,38</text>
    <text x="474" y="53" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">IMPACTO ESTIMADO</text>
  </g>
  <g transform="translate(850 122)">
    <rect width="270" height="120" rx="18" fill="#f8fafc" opacity="0.97"/>
    <text x="24" y="35" fill="#475569" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">REGRA DO DESAFIO</text>
    <text x="24" y="76" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700">18%  →  7%</text>
    <text x="24" y="99" fill="#64748b" font-family="Arial, sans-serif" font-size="13">mesma UF    interestadual</text>
  </g>
</svg>
